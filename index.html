<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Horror Multiplayer</title>

<style>

* {
    box-sizing:border-box;
}

html,
body {

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:Arial,sans-serif;
}

canvas {

    display:block;
}


/* CROSSHAIR */

#crosshair {

    position:fixed;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:
        translate(-50%,-50%);

    background:white;

    border-radius:50%;

    z-index:20;

    pointer-events:none;

    box-shadow:
        0 0 5px #000;
}


/* START */

#start {

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    justify-content:center;
    align-items:center;

    color:white;

    background:
        radial-gradient(
            circle,
            rgba(30,40,45,.3),
            rgba(0,0,0,.97)
        );

    cursor:pointer;

    text-align:center;
}

#title {

    font-size:42px;

    letter-spacing:8px;

    text-shadow:
        0 0 20px white;
}

#subtitle {

    margin-top:20px;

    opacity:.6;
}


/* HUD */

#info {

    position:fixed;

    left:15px;
    top:15px;

    padding:12px 16px;

    background:
        rgba(0,0,0,.6);

    color:white;

    border-radius:8px;

    z-index:20;

    font-size:14px;

    line-height:1.6;
}


#role {

    position:fixed;

    top:15px;

    left:50%;

    transform:
        translateX(-50%);

    padding:
        10px 20px;

    color:white;

    background:
        rgba(0,0,0,.7);

    border-radius:20px;

    z-index:20;

    font-weight:bold;
}


#status {

    position:fixed;

    bottom:20px;

    left:50%;

    transform:
        translateX(-50%);

    padding:
        8px 18px;

    background:
        rgba(0,0,0,.6);

    color:white;

    border-radius:20px;

    z-index:20;
}


#flashlightStatus {

    position:fixed;

    right:20px;

    bottom:20px;

    color:white;

    background:
        rgba(0,0,0,.6);

    padding:9px 14px;

    border-radius:8px;

    z-index:20;
}


#grenadeCooldown {

    position:fixed;

    right:20px;

    bottom:65px;

    color:white;

    background:
        rgba(0,0,0,.6);

    padding:9px 14px;

    border-radius:8px;

    z-index:20;
}


/* FLASH */

#flash {

    position:fixed;

    inset:0;

    background:white;

    opacity:0;

    z-index:100;

    pointer-events:none;

    mix-blend-mode:screen;
}


#afterglow {

    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.95),
            rgba(255,255,255,.45) 30%,
            rgba(255,255,255,.1) 65%,
            transparent
        );

    opacity:0;

    z-index:99;

    pointer-events:none;
}


#vignette {

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:15;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.6)
        );
}

</style>

</head>

<body>


<div id="start">

    <div>

        <div id="title">
            HORROR WORLD
        </div>

        <div id="subtitle">
            KLICKEN ZUM STARTEN
        </div>

    </div>

</div>


<div id="crosshair"></div>


<div id="info">

    <b>CONTROLS</b><br>

    W A S D → Bewegen<br>

    SHIFT → Sprint<br>

    SPACE → Springen<br>

    F → Taschenlampe<br>

    Q → Blendgranate<br>

    Maus → Umschauen

</div>


<div id="role">
    Verbinde...
</div>


<div id="status">
    Erkundung...
</div>


<div id="flashlightStatus">
    🔦 Taschenlampe: AN
</div>


<div id="grenadeCooldown">
    💥 Blendgranate bereit
</div>


<div id="afterglow"></div>

<div id="flash"></div>

<div id="vignette"></div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =====================================================
// MULTIPLAYER
// =====================================================

let socket;

let myId = null;

let isMonster = false;

const remotePlayers = {};


// =====================================================
// WEBSOCKET VERBINDUNG
// =====================================================

function connectMultiplayer() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host
        );


    socket.addEventListener(
        "open",
        () => {

            console.log(
                "WebSocket verbunden"
            );

        }
    );


    socket.addEventListener(
        "message",
        event => {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.type ===
                "welcome"
            ) {

                myId =
                    data.id;

                isMonster =
                    data.monster;

                updateRole();
            }


            if (
                data.type ===
                "role"
            ) {

                isMonster =
                    data.monster;

                updateRole();
            }


            if (
                data.type ===
                "players"
            ) {

                updateRemotePlayers(
                    data.players
                );
            }


            if (
                data.type ===
                "flashbang"
            ) {

                if (
                    data.owner !==
                    myId
                ) {

                    const position =
                        new THREE.Vector3(
                            data.x,
                            data.y,
                            data.z
                        );

                    explodeFlashbang(
                        position
                    );
                }
            }


            if (
                data.type ===
                "monsterAction"
            ) {

                console.log(
                    "Monster:",
                    data.action
                );
            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            document.getElementById(
                "role"
            ).textContent =
                "⚠ Verbindung verloren";

        }
    );
}


// =====================================================
// ROLLE
// =====================================================

function updateRole() {

    const role =
        document.getElementById(
            "role"
        );


    if (isMonster) {

        role.textContent =
            "👹 DU BIST DAS MONSTER";

    } else {

        role.textContent =
            "👤 DU WIRST GEJAGT";

    }
}


// =====================================================
// 3D SZENE
// =====================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x05070a
    );

scene.fog =
    new THREE.Fog(
        0x05070a,
        15,
        140
    );


// =====================================================
// KAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth /
        innerHeight,
        .1,
        500
    );


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LICHT
// =====================================================

const ambient =
    new THREE.HemisphereLight(
        0x667788,
        0x101010,
        .7
    );

scene.add(ambient);


const moon =
    new THREE.DirectionalLight(
        0x8899aa,
        1.5
    );

moon.position.set(
    30,
    60,
    20
);

moon.castShadow =
    true;

moon.shadow.mapSize.width =
    2048;

moon.shadow.mapSize.height =
    2048;

scene.add(moon);


// =====================================================
// TASCHENLAMPE
// =====================================================

let flashlightOn =
    true;


const flashlight =
    new THREE.SpotLight(
        0xffffff,
        6,
        55,
        Math.PI / 7,
        .3,
        1
    );

flashlight.castShadow =
    true;

scene.add(
    flashlight
);

scene.add(
    flashlight.target
);


// =====================================================
// KOLLISIONSOBJEKTE
// =====================================================

const obstacles = [];


// =====================================================
// BODEN
// =====================================================

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            220,
            220
        ),

        new THREE.MeshStandardMaterial({

            color:0x182018,

            roughness:1

        })

    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow =
    true;

scene.add(ground);


// =====================================================
// WAND
// =====================================================

function createWall(
    x,
    y,
    z,
    width,
    height,
    depth,
    color=0x353535
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color,
                roughness:.85
            })

        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;

    wall.receiveShadow =
        true;


    scene.add(wall);

    obstacles.push(wall);

    return wall;
}


// =====================================================
// FENSTER
// =====================================================

function createWindow(
    x,
    y,
    z
) {

    const glass =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.8,
                1.5,
                .08
            ),

            new THREE.MeshStandardMaterial({

                color:0x172a35,

                metalness:.25,

                roughness:.2

            })

        );


    glass.position.set(
        x,
        y,
        z
    );


    scene.add(glass);
}


// =====================================================
// TÜR
// =====================================================

function createDoor(
    x,
    y,
    z
) {

    const door =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.8,
                3.2,
                .15
            ),

            new THREE.MeshStandardMaterial({

                color:0x241b16,

                roughness:.8

            })

        );


    door.position.set(
        x,
        y,
        z
    );


    door.castShadow =
        true;


    scene.add(door);

    obstacles.push(door);
}


// =====================================================
// HAUS
// =====================================================

function createHouse(
    x,
    z,
    scale=1
) {

    const width =
        14 * scale;

    const height =
        5.5 * scale;

    const depth =
        12 * scale;


    createWall(
        x,
        height/2,
        z-depth/2,
        width,
        height,
        .45*scale,
        0x343638
    );


    createWall(
        x-width/2,
        height/2,
        z,
        .45*scale,
        height,
        depth,
        0x303234
    );


    createWall(
        x+width/2,
        height/2,
        z,
        .45*scale,
        height,
        depth,
        0x303234
    );


    createWall(
        x-width*.32,
        height/2,
        z+depth/2,
        width*.36,
        height,
        .45*scale,
        0x343638
    );


    createWall(
        x+width*.32,
        height/2,
        z+depth/2,
        width*.36,
        height,
        .45*scale,
        0x343638
    );


    createDoor(
        x,
        height*.31,
        z+depth/2+.05
    );


    createWindow(
        x-width*.31,
        height*.58,
        z+depth/2+.27
    );


    createWindow(
        x+width*.31,
        height*.58,
        z+depth/2+.27
    );


    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                width*.78,
                4.5*scale,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:0x191919,
                roughness:1
            })

        );


    roof.position.set(
        x,
        height+2.2*scale,
        z
    );


    roof.rotation.y =
        Math.PI/4;


    roof.castShadow =
        true;


    scene.add(roof);
}


createHouse(18,-18,1.5);
createHouse(-22,-35,1.35);
createHouse(38,28,1.25);
createHouse(-38,35,1.2);
createHouse(5,-60,1.1);


// =====================================================
// STRASSEN
// =====================================================

function createRoad(
    x,
    z,
    width,
    length
) {

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .05,
                length
            ),

            new THREE.MeshStandardMaterial({
                color:0x292929,
                roughness:1
            })

        );


    road.position.set(
        x,
        .025,
        z
    );


    scene.add(road);
}


createRoad(0,0,7,180);
createRoad(35,0,7,180);
createRoad(-35,0,7,180);
createRoad(0,-20,180,7);
createRoad(0,25,180,7);


// =====================================================
// BÄUME
// =====================================================

function createTree(
    x,
    z,
    scale=1
) {

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .45*scale,
                .7*scale,
                5*scale,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x342318
            })

        );


    trunk.position.set(
        x,
        2.5*scale,
        z
    );


    trunk.castShadow =
        true;


    scene.add(trunk);

    obstacles.push(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                3*scale,
                7*scale,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x102016
            })

        );


    leaves.position.set(
        x,
        7*scale,
        z
    );


    leaves.castShadow =
        true;


    scene.add(leaves);
}


for(
    let i=0;
    i<180;
    i++
){

    const side =
        Math.random()<.5
        ? -1
        : 1;


    const x =
        side *
        (
            50+
            Math.random()*45
        );


    const z =
        -85+
        Math.random()*170;


    createTree(
        x,
        z,
        .75+
        Math.random()*.8
    );
}


// =====================================================
// SPIELER
// =====================================================

const player = {

    position:
        new THREE.Vector3(
            0,
            1,
            8
        ),

    velocityY:0,

    height:1.8,

    radius:.4,

    walkSpeed:6,

    sprintSpeed:10,

    grounded:true
};


// =====================================================
// TASTEN
// =====================================================

const keys={};


window.addEventListener(
    "keydown",
    event => {

        keys[event.code]=true;


        if(
            event.code==="Space" &&
            player.grounded
        ){

            player.velocityY=7.2;

            player.grounded=false;
        }


        if(
            event.code==="KeyF" &&
            !event.repeat
        ){

            flashlightOn =
                !flashlightOn;


            flashlight.visible =
                flashlightOn;


            document.getElementById(
                "flashlightStatus"
            ).textContent =

                flashlightOn
                ?
                "🔦 Taschenlampe: AN"
                :
                "🔦 Taschenlampe: AUS";


            sendState();
        }


        if(
            event.code==="KeyQ" &&
            !event.repeat
        ){

            throwFlashbang();
        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code]=false;

    }
);


// =====================================================
// MAUS
// =====================================================

let yaw=0;

let pitch=0;


document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement
            !==
            renderer.domElement
        )
            return;


        yaw -=
            event.movementX*.002;


        pitch -=
            event.movementY*.002;


        pitch =
            Math.max(
                -Math.PI/2,
                Math.min(
                    Math.PI/2,
                    pitch
                )
            );

    }
);


document.getElementById(
    "start"
).addEventListener(
    "click",
    () => {

        renderer.domElement
            .requestPointerLock();

        document.getElementById(
            "start"
        ).style.display="none";

    }
);


// =====================================================
// KOLLISION
// =====================================================

function collides(position){

    const box =
        new THREE.Box3();


    box.setFromCenterAndSize(

        new THREE.Vector3(
            position.x,
            position.y,
            position.z
        ),

        new THREE.Vector3(
            player.radius*2,
            player.height,
            player.radius*2
        )

    );


    const obstacleBox =
        new THREE.Box3();


    for(
        const obstacle
        of obstacles
    ){

        obstacleBox.setFromObject(
            obstacle
        );


        if(
            box.intersectsBox(
                obstacleBox
            )
        ){

            return true;
        }
    }


    return false;
}


// =====================================================
// BEWEGUNG
// =====================================================

function movePlayer(dt){

    const direction =
        new THREE.Vector3();


    if(keys["KeyW"])
        direction.z-=1;

    if(keys["KeyS"])
        direction.z+=1;

    if(keys["KeyA"])
        direction.x-=1;

    if(keys["KeyD"])
        direction.x+=1;


    if(
        direction.length()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(

            new THREE.Vector3(
                0,1,0
            ),

            yaw

        );


        let speed =
            player.walkSpeed;


        if(
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        ){

            speed =
                player.sprintSpeed;
        }


        const nextX =
            player.position.clone();


        nextX.x +=
            direction.x*
            speed*
            dt;


        if(
            !collides(nextX)
        ){

            player.position.x =
                nextX.x;
        }


        const nextZ =
            player.position.clone();


        nextZ.z +=
            direction.z*
            speed*
            dt;


        if(
            !collides(nextZ)
        ){

            player.position.z =
                nextZ.z;
        }

    }


    player.velocityY -=
        18*dt;


    player.position.y +=
        player.velocityY*dt;


    if(
        player.position.y<=1
    ){

        player.position.y=1;

        player.velocityY=0;

        player.grounded=true;
    }
}


// =====================================================
// MULTIPLAYER STATE SENDEN
// =====================================================

let sendTimer=0;


function sendState(){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    )
        return;


    socket.send(
        JSON.stringify({

            type:"state",

            x:player.position.x,

            y:player.position.y,

            z:player.position.z,

            yaw,

            pitch,

            flashlight:
                flashlightOn

        })
    );
}


function updateNetwork(dt){

    sendTimer+=dt;


    if(
        sendTimer>.05
    ){

        sendTimer=0;

        sendState();
    }
}


// =====================================================
// ANDERE SPIELER
// =====================================================

function createRemotePlayer(
    data
){

    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .35,
                1,
                6,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:
                    data.monster
                    ? 0x550000
                    : 0x336699
            })

        );


    body.position.y=.9;

    body.castShadow=true;

    group.add(body);


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .3,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color:0x888888
            })

        );


    head.position.y=1.9;

    head.castShadow=true;

    group.add(head);


    scene.add(group);


    remotePlayers[data.id]={
        group,
        data
    };
}


function updateRemotePlayers(
    players
){

    const existing =
        new Set();


    for(
        const data
        of players
    ){

        if(
            data.id===myId
        )
            continue;


        existing.add(data.id);


        if(
            !remotePlayers[data.id]
        ){

            createRemotePlayer(
                data
            );
        }


        const remote =
            remotePlayers[data.id];


        remote.data=data;


        remote.group.position.set(
            data.x,
            data.y-1,
            data.z
        );


        remote.group.rotation.y =
            data.yaw;


        // Monster rot markieren

        const body =
            remote.group.children[0];


        if(
            body
        ){

            body.material.color =
                data.monster
                ? 0x770000
                : 0x336699;
        }
    }


    // Spieler entfernen

    for(
        const id
        in remotePlayers
    ){

        if(
            !existing.has(id)
        ){

            scene.remove(
                remotePlayers[id].group
            );

            delete remotePlayers[id];
        }
    }
}


// =====================================================
// GRANATEN
// =====================================================

const grenades=[];

let grenadeCooldown=0;

const GRENADE_COOLDOWN=5;


function throwFlashbang(){

    if(
        grenadeCooldown>0
    )
        return;


    grenadeCooldown =
        GRENADE_COOLDOWN;


    const grenade =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .18,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({

                color:0x777777,

                metalness:.8,

                roughness:.2

            })

        );


    grenade.position.copy(
        camera.position
    );


    scene.add(grenade);


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    const velocity =
        direction.multiplyScalar(
            16
        );


    velocity.y+=5;


    grenades.push({

        mesh:grenade,

        velocity,

        life:0

    });


    // Andere Spieler informieren

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({

                type:
                    "flashbang",

                x:
                    player.position.x,

                y:
                    player.position.y,

                z:
                    player.position.z

            })
        );
    }
}


// =====================================================
// GRANATEN UPDATE
// =====================================================

function updateGrenades(dt){

    for(
        let i=grenades.length-1;
        i>=0;
        i--
    ){

        const grenade =
            grenades[i];


        grenade.life+=dt;


        grenade.velocity.y -=
            14*dt;


        grenade.mesh.position.add(

            grenade.velocity
                .clone()
                .multiplyScalar(dt)

        );


        grenade.mesh.rotation.x +=
            dt*10;

        grenade.mesh.rotation.y +=
            dt*13;


        if(
            grenade.mesh.position.y<.2
        ){

            grenade.mesh.position.y=.2;

            grenade.velocity.y*=-.55;

            grenade.velocity.x*=.78;

            grenade.velocity.z*=.78;
        }


        if(
            grenade.life>=2.4
        ){

            explodeFlashbang(
                grenade.mesh.position
            );


            scene.remove(
                grenade.mesh
            );


            grenades.splice(
                i,
                1
            );
        }
    }
}


// =====================================================
// PARTIKEL
// =====================================================

const particles=[];


function particle(
    position,
    velocity,
    life,
    size,
    smoke=false
){

    const material =
        new THREE.MeshBasicMaterial({

            color:
                smoke
                ? 0x777777
                : 0xffffff,

            transparent:true,

            opacity:
                smoke
                ? .35
                : 1

        });


    const mesh =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                size,
                6,
                6
            ),

            material

        );


    mesh.position.copy(
        position
    );


    scene.add(mesh);


    particles.push({

        mesh,

        velocity:
            velocity.clone(),

        life,

        maxLife:
            life,

        smoke

    });
}


// =====================================================
// BLITZPARTIKEL
// =====================================================

function flashParticles(
    position
){

    for(
        let i=0;
        i<150;
        i++
    ){

        const dir =
            new THREE.Vector3(

                Math.random()-.5,

                Math.random()-.5,

                Math.random()-.5

            ).normalize();


        particle(

            position,

            dir.multiplyScalar(
                3+
                Math.random()*14
            ),

            .4+
            Math.random()*.8,

            .025+
            Math.random()*.06

        );
    }
}


// =====================================================
// RAUCH
// =====================================================

function smokeParticles(
    position
){

    for(
        let i=0;
        i<45;
        i++
    ){

        particle(

            position,

            new THREE.Vector3(

                (Math.random()-.5)*2,

                1+
                Math.random()*3,

                (Math.random()-.5)*2

            ),

            1.5+
            Math.random(),

            .12+
            Math.random()*.2,

            true

        );
    }
}


// =====================================================
// EXPLOSION
// =====================================================

function explodeFlashbang(
    position
){

    const light =
        new THREE.PointLight(
            0xffffff,
            180,
            65,
            1.8
        );


    light.position.copy(
        position
    );


    scene.add(light);


    // Lichtkegel

    const cone =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                7,
                16,
                32,
                1,
                true
            ),

            new THREE.MeshBasicMaterial({

                color:0xffffff,

                transparent:true,

                opacity:.22,

                side:
                    THREE.DoubleSide,

                depthWrite:false

            })

        );


    cone.position.copy(
        position
    );


    scene.add(cone);


    flashParticles(
        position
    );


    smokeParticles(
        position
    );


    flashScreen(
        position
    );


    let intensity=180;


    const interval =
        setInterval(
            () => {

                intensity*=.72;

                light.intensity=
                    intensity;

                cone.material.opacity*=.83;


                if(
                    intensity<.15
                ){

                    clearInterval(
                        interval
                    );

                    scene.remove(
                        light
                    );

                    scene.remove(
                        cone
                    );

                    cone.geometry.dispose();

                    cone.material.dispose();
                }

            },
            25
        );
}


// =====================================================
// SCREEN FLASH
// =====================================================

function flashScreen(
    position
){

    const distance =
        camera.position.distanceTo(
            position
        );


    const maxDistance=32;


    if(
        distance>maxDistance
    )
        return;


    let strength =
        1-
        distance/maxDistance;


    strength =
        Math.pow(
            Math.max(
                0,
                strength
            ),
            .65
        );


    const flash =
        document.getElementById(
            "flash"
        );


    const afterglow =
        document.getElementById(
            "afterglow"
        );


    flash.style.opacity =
        Math.min(
            1,
            strength*2
        );


    afterglow.style.opacity =
        strength*.9;


    setTimeout(
        ()=>{
            flash.style.opacity=0;
        },
        140
    );


    setTimeout(
        ()=>{
            afterglow.style.opacity=
                strength*.55;
        },
        250
    );


    setTimeout(
        ()=>{
            afterglow.style.opacity=
                strength*.25;
        },
        500
    );


    setTimeout(
        ()=>{
            afterglow.style.opacity=0;
        },
        1000+
        strength*600
    );
}


// =====================================================
// PARTIKEL UPDATE
// =====================================================

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.life-=dt;


        p.mesh.position.add(

            p.velocity
                .clone()
                .multiplyScalar(dt)

        );


        if(
            p.smoke
        ){

            p.velocity.y -=
                2.5*dt;

            p.velocity.multiplyScalar(
                .98
            );

            p.mesh.scale.multiplyScalar(
                1+dt*.8
            );

        } else {

            p.velocity.multiplyScalar(
                .97
            );
        }


        p.mesh.material.opacity =
            Math.max(
                0,
                p.life/p.maxLife
            );


        if(
            p.life<=0
        ){

            scene.remove(
                p.mesh
            );

            p.mesh.geometry.dispose();

            p.mesh.material.dispose();

            particles.splice(
                i,
                1
            );
        }
    }
}


// =====================================================
// COOLDOWN
// =====================================================

function updateCooldown(dt){

    if(
        grenadeCooldown>0
    ){

        grenadeCooldown-=dt;

        if(
            grenadeCooldown<0
        )
            grenadeCooldown=0;
    }


    document.getElementById(
        "grenadeCooldown"
    ).textContent =

        grenadeCooldown>0

        ?

        "💥 Blendgranate: "+
        grenadeCooldown.toFixed(1)+
        " s"

        :

        "💥 Blendgranate bereit";
}


// =====================================================
// KAMERA
// =====================================================

function updateCamera(){

    camera.position.copy(
        player.position
    );


    camera.position.y+=.8;


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    flashlight.position.copy(
        camera.position
    );


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    flashlight.target.position.copy(
        camera.position
    );


    flashlight.target.position.add(
        direction.multiplyScalar(
            25
        )
    );
}


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =
    performance.now();


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            (time-lastTime)/
            1000,
            .05
        );


    lastTime=time;


    movePlayer(dt);

    updateNetwork(dt);

    updateGrenades(dt);

    updateParticles(dt);

    updateCooldown(dt);

    updateCamera();


    document.getElementById(
        "status"
    ).textContent =

        isMonster
        ?
        "👹 MONSTER"
        :
        "👤 GEJAGT";


    renderer.render(
        scene,
        camera
    );
}


// =====================================================
// START
// =====================================================

connectMultiplayer();

animate(
    performance.now()
);

</script>
